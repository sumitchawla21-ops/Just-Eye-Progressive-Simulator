name: Build JUST EYE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Repair Android project structure
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/justeye/progressivesimulator
          mkdir -p app/src/main/res/values

          mv -f MainActivity.kt app/src/main/java/com/justeye/progressivesimulator/MainActivity.kt 2>/dev/null || true
          mv -f SimulationOverlays.kt app/src/main/java/com/justeye/progressivesimulator/SimulationOverlays.kt 2>/dev/null || true
          mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml 2>/dev/null || true
          mv -f strings.xml app/src/main/res/values/strings.xml 2>/dev/null || true
          mv -f build.gradle app/build.gradle 2>/dev/null || true

          # Create root build.gradle if missing
          if [ ! -f build.gradle ]; then
            cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          fi

          # Create root settings.gradle if missing
          if [ ! -f settings.gradle ]; then
            echo "include ':app'" > settings.gradle
          fi

      - name: Setup Gradle Wrapper & Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Just-Eye-App
          path: app/build/outputs/apk/debug/*.apk
