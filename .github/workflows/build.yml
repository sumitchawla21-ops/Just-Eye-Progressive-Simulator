name: Build JUST EYE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Check Android source structure
        run: |
          echo "=== MainActivity files ==="
          find . -name "MainActivity.kt" -print
          echo "=== App source directory ==="
          find app/src/main -maxdepth 6 -type f -print

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify MainActivity in APK
        run: |
          echo "=== APK contents ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -i "MainActivity"
          
          if ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "MainActivity"; then
            echo "ERROR: MainActivity was not found in the APK"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUST-EYE-Progressive-Simulator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
