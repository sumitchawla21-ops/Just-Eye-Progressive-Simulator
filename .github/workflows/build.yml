name: Build JUST EYE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restructure Project Files
        run: |
          mkdir -p app/src/main/java/com/justeye/progressivesimulator
          mkdir -p app/src/main/res/values

          # Move source files
          find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/justeye/progressivesimulator/ \;
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/

          # Create root settings.gradle
          echo "include ':app'" > settings.gradle

          # Create root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Create app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.justeye.progressivesimulator'
              compileSdk 34

              defaultConfig {
                  applicationId "com.justeye.progressivesimulator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Build APK with Gradle 8.2
        run: |
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Just-Eye-App
          path: app/build/outputs/apk/debug/*.apk
