name: Build JUST EYE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Restructure Project Files & Patch Code
        run: |
          mkdir -p app/src/main/java/com/justeye/progressivesimulator
          mkdir -p app/src/main/res/values

          # Move Kotlin source files
          find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/justeye/progressivesimulator/ \;
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/

          # Cleanly patch imports using Python to avoid syntax corruption
          python3 -c "
          import os

          # Patch SimulationOverlays.kt
          sim_path = 'app/src/main/java/com/justeye/progressivesimulator/SimulationOverlays.kt'
          if os.path.exists(sim_path):
              with open(sim_path, 'r') as f:
                  content = f.read()
              if 'import androidx.compose.ui.graphics.drawscope.Stroke' not in content:
                  content = 'import androidx.compose.ui.graphics.drawscope.Stroke\n' + content
              with open(sim_path, 'w') as f:
                  f.write(content)

          # Patch MainActivity.kt
          main_path = 'app/src/main/java/com/justeye/progressivesimulator/MainActivity.kt'
          if os.path.exists(main_path):
              with open(main_path, 'r') as f:
                  content = f.read()
              imports = [
                  'import androidx.compose.ui.Modifier',
                  'import androidx.camera.view.PreviewView',
                  'import androidx.camera.lifecycle.ProcessCameraProvider',
                  'import androidx.compose.ui.platform.LocalContext'
              ]
              new_imports = '\n'.join([imp for imp in imports if imp not in content])
              if new_imports:
                  content = new_imports + '\n' + content
              with open(main_path, 'w') as f:
                  f.write(content)
          "

          # Generate themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.JustEye" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#6200EE</item>
                  <item name="colorPrimaryVariant">#3700B3</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
              </style>
          </resources>
          EOF

          # Create root settings.gradle
          echo "include ':app'" > settings.gradle

          # Create root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Create app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.justeye.progressivesimulator'
              compileSdk 34

              defaultConfig {
                  applicationId "com.justeye.progressivesimulator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.4'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              // Jetpack Compose
              implementation platform('androidx.compose:compose-bom:2023.10.01')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.runtime:runtime'

              // CameraX
              implementation 'androidx.camera:camera-core:1.3.1'
              implementation 'androidx.camera:camera-camera2:1.3.1'
              implementation 'androidx.camera:camera-lifecycle:1.3.1'
              implementation 'androidx.camera:camera-view:1.3.1'
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Just-Eye-App
          path: app/build/outputs/apk/debug/*.apk
