name: Build JUST EYE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair Android project structure
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/justeye/progressivesimulator
          mkdir -p app/src/main/res/values

          mv -f MainActivity.kt app/src/main/java/com/justeye/progressivesimulator/MainActivity.kt
          mv -f SimulationOverlays.kt app/src/main/java/com/justeye/progressivesimulator/SimulationOverlays.kt
          mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv -f styles.xml app/src/main/res/values/styles.xml

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.justeye.progressivesimulator"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.justeye.progressivesimulator"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildFeatures {
                  compose = true
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2026.09.00")
              implementation(composeBom)

              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.11.0")

              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.ui:ui-tooling-preview")

              debugImplementation("androidx.compose.ui:ui-tooling")

              implementation("androidx.camera:camera-camera2:1.6.2")
              implementation("androidx.camera:camera-core:1.6.2")
              implementation("androidx.camera:camera-lifecycle:1.6.2")
              implementation("androidx.camera:camera-view:1.6.2")
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUST-EYE-Progressive-Simulator-debug
          path: app/build/outputs/apk/debug/app-debug.apkname: Build JUST EYE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Restructure Project Files & Generate Resources
        run: |
          mkdir -p app/src/main/java/com/justeye/progressivesimulator
          mkdir -p app/src/main/res/values

          # Move Kotlin source files
          find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/justeye/progressivesimulator/ \;
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/

          # Generate themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.JustEye" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#6200EE</item>
                  <item name="colorPrimaryVariant">#3700B3</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
              </style>
          </resources>
          EOF

          # Create root settings.gradle
          echo "include ':app'" > settings.gradle

          # Create root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Create app/build.gradle with Compose & CameraX support
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.justeye.progressivesimulator'
              compileSdk 34

              defaultConfig {
                  applicationId "com.justeye.progressivesimulator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.3'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              // Jetpack Compose
              implementation platform('androidx.compose:compose-bom:2023.10.01')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.runtime:runtime'

              // CameraX
              implementation 'androidx.camera:camera-core:1.3.1'
              implementation 'androidx.camera:camera-camera2:1.3.1'
              implementation 'androidx.camera:camera-lifecycle:1.3.1'
              implementation 'androidx.camera:camera-view:1.3.1'
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Just-Eye-App
          path: app/build/outputs/apk/debug/*.apk
